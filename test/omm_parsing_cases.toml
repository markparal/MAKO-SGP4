# OMM Parsing Verification Test Cases
#
# Expected GP fields verified against python-sgp4 (sgp4.omm.initialize).
# Units match this repo's GenPerturbElementSet conventions:
# - first_derivative_of_mean_motion = OMM MEAN_MOTION_DOT * 2  [revs/day^2]
# - second_derivative_of_mean_motion = OMM MEAN_MOTION_DDOT * 6 [revs/day^3]
# - angles in degrees, mean_motion in revs/day, bstar in 1/Earth radii
#
# The OMMs contained here are derived from Celestrak OMM data and modified
# for parser testing. These are not to be used for propagation
# purposes, but only to validate the parsing of the OMM functions.

[test.case1]
name = "Nominal Example 1"
omm_kvn = """
CCSDS_OMM_VERS = 2.0
CREATION_DATE  = 
ORIGINATOR     = 

OBJECT_NAME    = 2026-106A
OBJECT_ID      = 2026-106A
CENTER_NAME    = EARTH
REF_FRAME      = TEME
TIME_SYSTEM    = UTC
MEAN_ELEMENT_THEORY = SGP/SGP4

EPOCH          = 2026-06-14T15:07:48.259488
MEAN_MOTION    = 15.11169557
ECCENTRICITY   = .00147468
INCLINATION    = 97.5103
RA_OF_ASC_NODE = 247.7605
ARG_OF_PERICENTER = 169.6213
MEAN_ANOMALY   = 190.5325

EPHEMERIS_TYPE = 0
CLASSIFICATION_TYPE = U
NORAD_CAT_ID   = 69097
ELEMENT_SET_NO = 999
REV_AT_EPOCH   = 459
BSTAR          = .39221734E-3
MEAN_MOTION_DOT = .6535E-4
MEAN_MOTION_DDOT = 0
"""
common_name = "2026-106A"
satellite_catalog_number = 69097
classification = "U"
international_designator = "2026-106A"
epoch_datetime_year = 2026
epoch_datetime_month = 6
epoch_datetime_day = 14
epoch_datetime_hour = 15
epoch_datetime_minute = 7
epoch_datetime_second = 48.259488
first_derivative_of_mean_motion = 0.0001307
second_derivative_of_mean_motion = 0
bstar = 0.00039221734
ephemeris_type = 0
element_set_number = 999
inclination = 97.5103
right_ascension_of_ascending_node = 247.7605
eccentricity = 0.00147468
argument_of_perigee = 169.6213
mean_anomaly = 190.5325
mean_motion = 15.11169557
revolution_number_at_epoch = 459

