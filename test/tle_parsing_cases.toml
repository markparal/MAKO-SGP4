# TLE Parsing Verification Test Cases
#
# Expected GP fields verified against python-sgp4 (Satrec.twoline2rv).
# Units match this repo's GenPerturbElementSet conventions:
#   first_derivative_of_mean_motion = TLE n-dot field * 2  [revs/day^2]
#   second_derivative_of_mean_motion = decoded field * 6   [revs/day^3]
#   angles in degrees, mean_motion in revs/day, bstar in 1/Earth radii.
#
# The TLEs contained here are derived from Celestrak TLEs and modified 
# for parser testing. These are not to be used for propagation
# purposes, but only to validate the parsing of the TLE functions.

[test.case1]
name = "ISS Example"
tle = """
ISS (ZARYA)
1 25544U 98067A   08264.51782528 -.00002182 -00100-2 -11606-4 0  2921
2 25544  51.6416 247.4627 0006703 130.5360 325.0288 15.72125391563537
"""
common_name = "ISS (ZARYA)"
satellite_catalog_number = 25544
classification = "U"
international_designator = "1998-067A"
epoch_datetime_year = 2008
epoch_datetime_month = 9
epoch_datetime_day = 20
epoch_datetime_hour = 12
epoch_datetime_minute = 25
epoch_datetime_second = 40.104192
first_derivative_of_mean_motion = -4.364e-05
second_derivative_of_mean_motion = -6e-05
bstar = -1.1606e-05
ephemeris_type = 0
element_set_number = 292
inclination = 51.6416
right_ascension_of_ascending_node = 247.4627
eccentricity = 0.0006703
argument_of_perigee = 130.536
mean_anomaly = 325.0288
mean_motion = 15.72125391
revolution_number_at_epoch = 56353

